<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/auth.css">
  <title>Crear cuenta</title>
</head>
<body>
  <nav id="barra-sesion" class="barra"></nav>
  <main class="container">
    <h1>Crear cuenta</h1>
    <form id="form-cuenta" novalidate>
      <label for="nombre">Nombre completo</label>
      <input id="nombre" name="nombre" autocomplete="name" required>
      <span class="error" data-error="nombre"></span>
      <label for="email">Correo electrónico</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <span class="error" data-error="email"></span>
      <label for="password">Contraseña (mín. 8, con letras y números)</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required>
      <span class="error" data-error="password"></span>
      <label for="password2">Repetir contraseña</label>
      <input id="password2" name="password2" type="password" autocomplete="new-password" required>
      <span class="error" data-error="password2"></span>
      <span class="error" data-error="general"></span>
      <button type="submit">Crear cuenta</button>
    </form>
    <p>¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a></p>
  </main>
  <script type="module" src="js/pages/cuenta.js"></script>
</body>
</html>
